server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: movie-booking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/movie_booking}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1zZWNyZXQta2V5LWZvci1tb3ZpZS1ib29raW5nLWhhY2thdGhvbi1tdnAtMjU2Yml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: cinepulse_token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  seed:
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@cinepulse.com}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:Admin@123}
    admin-name: ${APP_SEED_ADMIN_NAME:System Admin}
    customer-email: ${APP_SEED_CUSTOMER_EMAIL:customer@cinepulse.com}
    customer-password: ${APP_SEED_CUSTOMER_PASSWORD:Customer@123}
    customer-name: ${APP_SEED_CUSTOMER_NAME:Demo Customer}
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8000}
  pricing:
    min-ticket-price: ${PRICING_MIN_TICKET_PRICE:120.00}
    single-screen-max: ${PRICING_SINGLE_SCREEN_MAX:350.00}
    multiplex-max: ${PRICING_MULTIPLEX_MAX:450.00}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
