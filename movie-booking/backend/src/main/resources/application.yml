server:
  port: 8080

spring:
  application:
    name: movie-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moviebooking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:dev-user}
    password: ${MAIL_PASSWORD:dev-pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-key-change-in-prod-9876543210abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  ticket:
    qr-secret: ${TICKET_QR_SECRET:dev-only-qr-hmac-secret-key-change-in-prod-1234567890}
  mail:
    from: ${MAIL_FROM:no-reply@moviebooking.local}
    max-retries: 3
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${ML_SERVICE_TIMEOUT_MS:5000}
  payment:
    provider: ${PAYMENT_GATEWAY_PROVIDER:MOCK}
    mock-secret: ${MOCK_PAYMENT_SECRET:dev-mock-payment-hmac-secret-key}
    razorpay-key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_secret_placeholder}
  booking:
    hold-expiry-minutes: ${HOLD_EXPIRY_MINUTES:5}
    cancellation-cutoff-hours: ${CANCELLATION_CUTOFF_HOURS:2}
    convenience-fee-percent: ${CONVENIENCE_FEE_PERCENT:5.0}
    gst-percent: ${GST_PERCENT:18.0}
  pricing:
    default-min-price: 100.00
    single-screen-default-max: 350.00
    multiplex-default-max: 450.00
    multipliers:
      FLOP: 0.75
      BELOW_AVERAGE: 0.90
      AVERAGE: 1.00
      HIT: 1.25
      SUPERHIT: 1.50
      BLOCKBUSTER: 1.65
      INDUSTRY_HIT: -1.0
