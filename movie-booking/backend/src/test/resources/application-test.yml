spring:
  datasource:
    url: jdbc:h2:mem:moviebooking_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-jwt-secret-key-minimum-32-bytes-long-12345
    expiration-ms: 3600000
  ticket:
    qr-secret: test-only-qr-hmac-secret-key-minimum-32-bytes-12345
  payment:
    provider: MOCK
    mock-secret: test-mock-payment-secret
  booking:
    hold-expiry-minutes: 5
    cancellation-cutoff-hours: 2
